experience:
  - organization: Central China Normal University
    role: Design Engineer
    start: 2024-05
    summary: Frontend and design implementation on the university's education AI team. I took several products from initial setup through launch and ongoing maintenance, with 460+ merged PRs and 150+ teammate reviews, plus intern reviews and internal frontend intro talks.
    projects:
      - name: Education AI agent platform
        start: 2025-09
        summary: Teachers and institutions configure AI agents here (experts, skills, MCP tools, knowledge bases) and embed them in teaching apps through an Embed SDK. One of the core frontend engineers with 170+ merged pull requests; I own the theme system.
        highlights:
          - Built the theme system from scratch. A theme workbench with drafts, versions, publishing, and rollback, distributed per authorized app; a Figma-style canvas editor with a layer tree and 100-step undo; a Figma plugin that keeps mockups and code in sync both ways through DTCG design tokens. Another platform already uses it for its skins.
          - Real-time voice input. An AudioWorklet captures 16 kHz PCM and a WebSocket relay streams it to streaming ASR, with authentication and cross-site WebSocket hijacking (CSWSH) protection.
          - Agent configuration. JSON Schema based business variables, multi-question follow-up cards, parallel sub-agents, and prompt versioning; fixed virtual scrolling in document previews of 1,400+ blocks and added regression tests.
          - The earlier workflow editor. A React Flow canvas with state rebuilt on Zustand, code nodes, variable references, dry runs, and undo/redo.
        stack: [React 19, TanStack Router/Query, tRPC, Drizzle, AI SDK, MCP, Plate.js, Figma Plugin API, Vitest, Playwright]
      - name: AI assistant for teacher education
        start: 2025-02
        end: 2026-06
        summary: After launch it branched into editions for several clients.
        highlights:
          - Wrote most of the first client (75% of its commits), live two weeks after the Lunar New Year. Streaming chat, D3 radar charts and Markdown inside messages, a WebRTC video avatar, and multiple languages.
          - The Next version moved to an agent architecture. I wrote its chat client and split the Module Federation loader into its own package, so the model can call remote chart components mid-conversation; fully rolled out in May 2025.
          - Led the front and back end of a vocational college edition. A step-by-step AI lesson-plan pipeline with partial regeneration, run on the server so jobs continue after the page is closed, with illustrations and export to Word and Feishu docs; role-based permissions checked in tRPC; on-premises deployment. V2.0 shipped in February 2026.
        stack: [React 19, React Router 7, tRPC, TanStack Query, AI SDK, Drizzle, Module Federation, D3, WebRTC]
      - name: ReplayKit interaction replay library
        start: 2026-05
        end: 2026-05
        summary: Records what happens in a browser or an editor as structured events and plays it back, instead of recording video. Designed and built alone.
        highlights:
          - Split into seven packages (core, recorder, player, cursor, annotations, audio, platejs) plus one umbrella package.
          - Masks sensitive input while recording; the player can seek and step; replayable blocks and a hand-drawn layer live inside Plate documents.
        stack: [TypeScript, Turborepo, tsdown, Vitest, happy-dom, Plate.js]
      - name: Feature flag and config platform
        start: 2024-05
        end: 2025-05
        summary: The team's in-house platform for switching product features per tenant, environment, and role. I built the frontend and the second-generation server from scratch.
        highlights:
          - The frontend started in an internal monorepo and moved to its own repository (96% of its commits). Multi-tenancy, role permissions, audit logs, and generating, deploying, and rolling back frontend versions; the app reads its own flags to switch routes, menus, and roles.
          - The second-generation server. NestJS and Prisma services for products, environments, flags, and audit logs, with soft delete, Docker, and CI; tests moved from Jest to Vitest.
        stack: [React, Ant Design, SWR, openapi-typescript, NestJS, Prisma, Vitest, Docker]
      - name: Other projects
        start: 2024-10
        end: 2026-07
        highlights:
          - A national annual student survey. A CLI that batch-renders the charts for provincial and county reports, which shipped two days early, plus school data work during the survey.
          - Video analysis. Wrapped a research partner's classroom video analysis algorithms as a deployable service (Flask, a SQLite job queue, subprocess isolation, pluggable ASR backends, Docker); cut OCR calls in an esports match review pipeline from about 2,400 to about 75.
          - A collaborative teaching workspace. Feishu Bitable sync, scheduled jobs, radar charts, and a view of sub-agents working together.
        stack: [Python, Flask, OpenCV, Bun, Chart.js, Plate.js]

