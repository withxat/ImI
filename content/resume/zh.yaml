experience:
  - organization: 华中师范大学
    role: Design Engineer
    start: 2024-05
    summary: 在学校的教育 AI 产品团队负责前端与设计实现，多个产品从立项起由我搭起前端并一路推到上线和维护。合并 PR 460 余个，Code Review 同事 PR 150 余个；也带实习生看代码，做过前端入门内部分享。
    projects:
      - name: 教育 AI 智能体平台
        start: 2025-09
        summary: 教师和机构在这里配置 AI 智能体（专家、技能、MCP 工具、知识库），再通过 Embed SDK 接入各个教学应用。担任核心前端开发之一，合并 PR 170 余个，主题系统由我负责。
        highlights:
          - 从零搭建主题系统：主题工作台支持草稿、版本、发布与回滚，按授权应用分发；Figma 式画布编辑器带图层树和 100 步 Undo；Figma 插件用 DTCG Design Token 让设计稿与代码双向同步。已用来给另一个平台换肤。
          - 实时语音输入：AudioWorklet 采集 16 kHz PCM，经 WebSocket Relay 接入流式 ASR，补上鉴权与跨站 WebSocket 劫持（CSWSH）防护。
          - Agent 配置体验：基于 JSON Schema 的业务变量、多题追问卡片、Sub-agent 并行运行、Prompt 版本管理；修复 1400+ 块大文档预览的虚拟滚动（Virtualization），并补回归测试。
          - 早期的工作流编辑器：React Flow 画布，用 Zustand 重构状态，实现代码节点、变量引用、试运行与 Undo / Redo。
        stack: [React 19, TanStack Router/Query, tRPC, Drizzle, AI SDK, MCP, Plate.js, Figma Plugin API, Vitest, Playwright]
      - name: 教师教育 AI 助手
        start: 2025-02
        end: 2026-06
        summary: 面向教师教育的 AI 助手，上线后衍生出多个面向不同客户的版本。
        highlights:
          - 第一版客户端主要由我开发（提交占比 75%），春节后两周上线：流式对话、对话里的 D3 雷达图与 Markdown 渲染、WebRTC 数字人视频、多语言。
          - Next 版改为 Agent 架构：我写了对话客户端，并把 Module Federation Loader 拆成独立包，让模型在对话中按需调用远程图表组件；2025 年 5 月全量上线。
          - 主导一所职业院校定制版的前后端：分步生成、可局部重生成的 AI 教案生成 Pipeline，由服务端执行，页面关闭后任务继续执行，带配图并导出 Word 与飞书文档；基于角色的权限与 tRPC 权限校验；支持本地化部署。V2.0 于 2026 年 2 月交付。
        stack: [React 19, React Router 7, tRPC, TanStack Query, AI SDK, Drizzle, Module Federation, D3, WebRTC]
      - name: ReplayKit 交互录制回放库
        start: 2026-05
        end: 2026-05
        summary: 把浏览器和编辑器里的操作录成结构化事件再回放，而不是录屏。独立设计与实现。
        highlights:
          - 拆成 core、recorder、player、cursor、annotations、audio、platejs 七个包，再发布一个聚合包。
          - 录制时给敏感输入脱敏；播放器支持跳转与逐步回放；在 Plate 文档里嵌入可回放的块和手绘层。
        stack: [TypeScript, Turborepo, tsdown, Vitest, happy-dom, Plate.js]
      - name: Feature Flag 与配置平台
        start: 2024-05
        end: 2025-05
        summary: 团队自研的 Feature Flag 与配置平台，按租户、环境和角色控制各个产品的功能。前端和第二代服务端由我从零搭建。
        highlights:
          - 前端先在内部 monorepo 里起步，后拆成独立仓库（提交占比 96%）：多租户、角色权限、操作日志，以及前端版本的生成、部署与回滚；应用读取自身的 Feature Flag 来切换路由、菜单和角色。
          - 第二代服务端：NestJS 加 Prisma 的产品、环境、Feature Flag 与操作日志服务，软删除、Docker 与 CI；测试从 Jest 迁到 Vitest。
        stack: [React, Ant Design, SWR, openapi-typescript, NestJS, Prisma, Vitest, Docker]
      - name: 其他项目
        start: 2024-10
        end: 2026-07
        highlights:
          - 全国性的年度学生调查：为省、县级报告批量生成图表的 CLI，报告比计划提前两天交付；调查期间还支援学校数据处理。
          - 视频分析：把合作研究团队的课堂视频分析算法封装成可部署服务（Flask、SQLite 任务队列、子进程隔离、可插拔的 ASR 后端、Docker）；电竞复盘 Pipeline 的 OCR 调用从约 2400 次降到约 75 次。
          - 协作教研空间：飞书多维表格同步、定时任务、数据雷达图，以及 Sub-agent 协作过程的展示。
        stack: [Python, Flask, OpenCV, Bun, Chart.js, Plate.js]

