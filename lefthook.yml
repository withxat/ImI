pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{js,ts,jsx,tsx,htm,html,json,yml,yaml,css,toml,astro,less,scss,md,xml,vue}'
      exclude: astro.config.ts
      run: pnpm exec eslint {staged_files} --fix --no-warn-ignored
      stage_fixed: true

    - name: lint-astro-config
      glob: astro.config.ts
      run: pnpm exec eslint astro.config.ts --no-warn-ignored

    - name: typecheck
      run: pnpm exec tsc --noEmit
      glob: '**/*.{ts,tsx,js,jsx}'
